<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ardour</title>
<style>
  :root { color-scheme: dark; }
  body { background: #14161a; color: #e6e6e6; font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  pre { background: #1d2026; border: 1px solid #2a2e36; border-radius: 6px; padding: 12px; overflow-x: auto; }
  .err { color: #ff8a80; }
  button { background: #2a2e36; color: #e6e6e6; border: 1px solid #3a3f4a; border-radius: 6px;
           padding: 8px 12px; font: inherit; }
</style>
</head>
<body>
<h1>Ardour &mdash; Android</h1>
<p id="status">reading engine information&hellip;</p>
<pre id="info"></pre>
<h2>Audio devices</h2>
<pre id="devices"></pre>
<p><button id="refresh">refresh</button></p>

<script>
function hasBridge() {
  return (typeof window.ArdourNative !== 'undefined') &&
         (window.ArdourNative && typeof window.ArdourNative.getEngineInfo === 'function');
}

function refresh() {
  var status = document.getElementById('status');
  var info = document.getElementById('info');
  var devices = document.getElementById('devices');

  if (!hasBridge()) {
    status.className = 'err';
    status.textContent = 'the native bridge is not available in this build';
    info.textContent = '';
    devices.textContent = '';
    return;
  }

  if (!window.ArdourNative.isEngineAvailable()) {
    status.className = 'err';
    status.textContent = 'the Ardour engine library is not present in this build';
    info.textContent = window.ArdourNative.getEngineInfo();
    devices.textContent = '';
    return;
  }

  status.className = '';
  status.textContent = 'engine available';
  info.textContent = window.ArdourNative.getEngineInfo();
  devices.textContent = window.ArdourNative.getAudioDevices();
}

document.getElementById('refresh').addEventListener('click', refresh);
refresh();
</script>
</body>
</html>
