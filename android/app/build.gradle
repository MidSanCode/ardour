plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.ardour.ardour'
    compileSdk 34

    defaultConfig {
        applicationId "org.ardour.ardour"
        // the engine is built against API 28 (AAudio needs 26, iconv in
        // bionic needs 28)
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // the same ABI the engine is cross-compiled for
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // The engine is a prebuilt shared library: it is produced by
    // "waf configure --dist-target=android" and copied into jniLibs by
    // tools/copy-android-engine.sh.  When it is missing the application still
    // builds and starts, and reports that the engine is not available.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
