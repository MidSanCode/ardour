plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.ardour.ardour'
    compileSdk 34

    defaultConfig {
        applicationId "org.ardour.ardour"
        // the engine is built against API 28 (AAudio needs 26, iconv in
        // bionic needs 28)
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // the ABIs the engine is cross-compiled for (x86_64: the emulator)
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // The engine is prebuilt: tools/android/collect-engine.sh puts the native
    // libraries of each ABI into src/main/jniLibs/<abi> and the engine's data
    // files into src/main/engine-assets/ardour.  The UI is the shared frontend
    // at the top of the repository, packaged as assets/web.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets', 'src/main/engine-assets', "$buildDir/generated/web-assets"]
        }
    }

    packagingOptions {
        jniLibs {
            // the engine finds its backends and panners by listing
            // nativeLibraryDir, so the libraries have to be extracted
            useLegacyPackaging true
        }
    }
}

// assets/web is a copy of frontend/, so that the frontend has one home
tasks.register('copyFrontend', Copy) {
    from "${rootDir}/../frontend"
    into "$buildDir/generated/web-assets/web"
}
preBuild.dependsOn copyFrontend

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
