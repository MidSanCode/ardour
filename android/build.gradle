// Top level build file for the Ardour Android application.
//
// The application is a WebView: the UI is the shared JavaScript frontend, the
// engine is the native libardour built for Android.  See README.md.
plugins {
    id 'com.android.application' version '8.4.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
