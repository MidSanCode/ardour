# Build Ardour on every platform the project supports: Linux, macOS, Windows.
#
# Platform coverage in the Ardour source tree:
#   * Linux   - alsa / pulseaudio / jack backends
#   * macOS   - coreaudio backend
#   * Windows - MSYS2/MinGW-w64 or MSVC; jack backend
#     (the PortAudio backend needs a PortAudio built with the Steinberg ASIO
#      SDK, so it is left disabled here - see the Windows job below)
#
# Two further jobs do not add platform coverage.  They pin structural
# invariants of the portable/mobile work, so that a later change cannot quietly
# undo them:
#   * headless-tkless - configures AND builds the engine with --no-tk-stack
#     (no ytk/ydk/ztk/clearlooks/gtkmm2ext/canvas/widgets/waveview at all).
#     Catches a toolkit dependency creeping back into the engine or into the
#     toolkit-free control-surface protocol (libs/surfaces/websockets).
#   * wasm32          - configure only, for --dist-target=wasm32, once with the
#     host compiler and once with emcc.  Catches a *host* branch leaking into
#     target selection (flags, dlopen probe, backend choice).  Cross-compiling
#     the C++ dependency stack to wasm is stage-1 work, so this job asserts the
#     target-branch decisions instead of a successful build.
#
# VERIFICATION STATUS
#   * windows-msys2 : reproduces a recipe that was actually run end to end on a
#                     Windows 10 + MSYS2 MinGW-w64 machine (1849/1849 targets,
#                     produces a working ardour-*.exe). Highest confidence.
#   * linux         : the first CI run reached configure and stopped at
#                     vamp-sdk/vamp-hostsdk. Both are mandatory, and both are
#                     shipped by the package named `vamp-plugin-sdk` (there is
#                     no libvamp-sdk-dev in Ubuntu). The package list is now
#                     shared through $ARDOUR_APT_DEPS so the three Linux jobs
#                     cannot drift apart, and the preflight step reports every
#                     remaining gap at once instead of one per run.
#   * macos         : the first CI run reached configure and stopped at
#                     "Checking for boost library >= 1.68 : no". That probe is
#                     a raw compile, not a pkg-config lookup, so it needs
#                     CPPFLAGS - the job now exports include, lib and pkgconfig
#                     paths for every formula it installs. Note that upstream
#                     states Homebrew is not a viable basis for Ardour's macOS
#                     build, so treat this job as exploratory: the preflight
#                     names what is still missing, and the FFTW
#                     fftwf_make_planner_thread_safe symbol is the next most
#                     likely blocker (packaged FFTW builds usually omit
#                     --with-combined-threads).
#   * headless-tkless: the configure half of this job was run by hand on a
#                     Windows + MSYS2 host (there with --dist-target=mingw); the
#                     build half has NOT been run anywhere yet.  Expect it to
#                     report real findings on its first run - that is the point.
#   * wasm32        : both configure steps were run by hand on a Windows host
#                     against emcc 6.0.11; this job is the Linux-host version of
#                     them.  The emcc step is *expected* to stop at the first
#                     C++ dependency that has no wasm build yet, and asserts
#                     that it stopped there and nowhere earlier.
#
# SELECTING TARGETS
#   push to master and pull_request runs build everything.
#   A manual run (Actions -> Build -> Run workflow) offers one checkbox per
#   target, all ticked by default: untick what you do not need and only the
#   remaining jobs are scheduled. The `selection` job always runs first and
#   writes the chosen set into the run summary, so it stays obvious what any
#   given run actually covered.
#   Manual runs are keyed separately in `concurrency`, so running one target now
#   and another one later does not cancel the first.
#
# BUILD TIME WARNING
#   Ardour is ~1M lines of C++ compiled at -O3. On GitHub-hosted runners the
#   optimized build can approach or exceed the 6 hour job limit, so every job
#   sets timeout-minutes explicitly and accepts a `debug_build` dispatch input
#   that drops --optimize to get a much faster (unoptimized) build.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      # The five targets are independent - tick only what you need. A manual
      # dispatch of one target is the fast path; the full set is five jobs and
      # the optimised platform builds can each take hours.
      # Automatic runs (push / pull_request) always run everything.
      linux:
        description: "Linux (x86_64)"
        type: boolean
        default: true
      macos:
        description: "macOS (arm64)"
        type: boolean
        default: true
      windows:
        description: "Windows (MSYS2 / MinGW-w64)"
        type: boolean
        default: true
      headless_tkless:
        description: "Structural: headless build without the toolkit"
        type: boolean
        default: true
      wasm32:
        description: "Structural: wasm32 target selection (configure only)"
        type: boolean
        default: true
      debug_build:
        description: "Skip --optimize (much faster CI build, slower binary)"
        type: boolean
        default: false

concurrency:
  # Push/PR runs coalesce per ref, so a newer commit supersedes an older run.
  # Manual dispatches are keyed by run_id instead: now that a run can carry a
  # selection, dispatching "linux now, windows later" must not cancel the first.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # waf asks git for the version (`git describe HEAD`). A shallow or tagless
  # checkout has no reachable tag, which makes waf abort. When that happens the
  # "Ensure a version..." step below creates this fallback tag. Bump it if you
  # fork Ardour and never fetch upstream tags.
  ARDOUR_FALLBACK_VERSION: "9.8"

  # Mandatory Debian/Ubuntu build dependencies, one entry per mandatory
  # autowaf.check_pkg() in the source tree (plus boost, which is a raw compile
  # probe rather than a pkg-config one).  Shared by every Linux job so that the
  # list cannot drift apart between them.
  #
  # Two of these names are not guessable and both cost a CI round-trip:
  #   libboost-dev    - wscript probes `#include <boost/version.hpp>` with
  #                     mandatory = True.  It is not a pkg-config lookup, so it
  #                     has to be installed explicitly instead of being left to
  #                     arrive transitively.
  #   vamp-plugin-sdk - despite the name this is the package that ships BOTH
  #                     vamp-sdk.pc and vamp-hostsdk.pc.  There is no
  #                     "libvamp-sdk-dev" in Ubuntu (nor "libvamp-sdk2v5"-with-
  #                     headers); the headers and .pc files live in this
  #                     oddly-named package.  Both vamp-sdk and vamp-hostsdk are
  #                     mandatory, so configure stops dead without it.
  ARDOUR_APT_DEPS: >-
    build-essential pkg-config python3 git gettext
    libboost-dev
    libglib2.0-dev libglibmm-2.4-dev libsigc++-2.0-dev
    libcairo2-dev libcairomm-1.0-dev
    libpango1.0-dev libpangomm-1.4-dev libfontconfig1-dev
    libpng-dev libsndfile1-dev libsamplerate0-dev libfftw3-dev
    libtag1-dev libxml2-dev libflac-dev libogg-dev
    liblilv-dev libserd-dev libsord-dev libsratom-dev lv2-dev
    librubberband-dev libaubio-dev
    vamp-plugin-sdk
    libarchive-dev libcurl4-openssl-dev liblo-dev
    libjack-jackd2-dev libasound2-dev
    libx11-dev libxext-dev

  # Optional dependencies, installed one at a time and allowed to fail.  None of
  # these can be mandatory for the configurations built here: cppunit is only
  # required with --build-tests, ltc and fluidsynth only with external libs, and
  # the rest are auto-detected features.
  ARDOUR_APT_DEPS_OPTIONAL: >-
    libusb-1.0-0-dev libpulse-dev libxi-dev libxrandr-dev
    liblrdf0-dev libsoundtouch-dev libwebsockets-dev
    libdbus-1-dev libcppunit-dev libltc-dev libfreetype6-dev

jobs:
  # ---------------------------------------------------------------------------
  # Always runs, even when every target is unticked. It makes the selection
  # visible before the expensive jobs start, and turns "dispatched with nothing
  # selected" - which would otherwise be a silently green run with zero jobs -
  # into a failure.
  selection:
    name: Selected targets
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Report the selection
        env:
          IN_LINUX: ${{ inputs.linux }}
          IN_MACOS: ${{ inputs.macos }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_HEADLESS_TKLESS: ${{ inputs.headless_tkless }}
          IN_WASM32: ${{ inputs.wasm32 }}
        run: |
          echo "### Selected targets" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Triggered by \`${{ github.event_name }}\`: all targets enabled." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Triggered by ${{ github.event_name }}: all targets enabled."
            exit 0
          fi

          echo "| target | enabled |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          enabled=0
          for pair in "linux:$IN_LINUX" "macos:$IN_MACOS" \
                      "windows:$IN_WINDOWS" \
                      "headless-tkless:$IN_HEADLESS_TKLESS" \
                      "wasm32:$IN_WASM32"; do
            target="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" = "true" ]; then
              row="| \`$target\` | yes |"; enabled=$((enabled + 1))
            else
              row="| \`$target\` | no |"
            fi
            echo "$row" >> "$GITHUB_STEP_SUMMARY"
            echo "$row"
          done

          if [ "$enabled" -eq 0 ]; then
            echo "::error::no target selected - this run would build nothing"
            exit 1
          fi
          echo "$enabled of 5 targets selected"

  # ---------------------------------------------------------------------------
  linux:
    name: Linux (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # waf derives the program version from git history and tags.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $ARDOUR_APT_DEPS

      - name: Install optional dependencies (best effort)
        run: |
          set -ux
          # One apt invocation per package on purpose: a single unavailable name
          # must not take the rest of the group down with it.
          for p in $ARDOUR_APT_DEPS_OPTIONAL; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::$p is not available - continuing without it"
          done

      - name: Preflight - every mandatory dependency is really present
        run: |
          # configure aborts on the first missing mandatory dependency, which
          # turns a long build into a slow game of whack-a-mole.  Report all of
          # them at once instead, before anything expensive happens.
          set -u
          missing=0
          for p in alsa glib-2.0 gthread-2.0 gio-2.0 gobject-2.0 gmodule-2.0 \
                   glibmm-2.4 giomm-2.4 sigc++-2.0 cairo cairomm-1.0 \
                   pango pangocairo pangomm-1.4 fontconfig libpng \
                   sndfile samplerate fftw3f taglib libxml-2.0 flac ogg \
                   libcurl libarchive liblo lilv-0 serd-0 sord-0 sratom-0 lv2 \
                   rubberband aubio vamp-sdk vamp-hostsdk x11 xext jack; do
            ver="$(pkg-config --modversion "$p" 2>/dev/null)" \
              || { echo "::error::MISSING pkg-config package: $p"; missing=1; continue; }
            echo "ok  $p $ver"
          done
          # boost has no .pc file at all, so probe the header the way waf does.
          cat > /tmp/boost_probe.cc <<'EOF'
          #include <boost/version.hpp>
          #if !defined(BOOST_VERSION) || BOOST_VERSION < 106800
          #error boost >= 1.68 is not available
          #endif
          int main(void) { return 0; }
          EOF
          c++ -o /tmp/boost_probe /tmp/boost_probe.cc \
            || { echo "::error::boost >= 1.68 headers are not visible to the compiler"; missing=1; }

          # FFTW: Ardour calls fftwf_make_planner_thread_safe(). That symbol
          # exists only when FFTW is built with threads AND
          # --with-combined-threads, which packaged builds routinely omit - it
          # is exactly why the windows-msys2 job builds FFTW from source.
          # Probe by LINKING rather than by inspecting symbols: linking is the
          # thing that actually has to succeed, and it is immune to a stripped
          # library giving a false negative.
          cat > /tmp/fftw_probe.cc <<'EOF'
          #include <fftw3.h>
          int main(void) { fftwf_make_planner_thread_safe(); return 0; }
          EOF
          if c++ -o /tmp/fftw_probe /tmp/fftw_probe.cc \
               $(pkg-config --cflags --libs fftw3f) 2> /tmp/fftw_probe.err; then
            echo "ok  fftw3f provides fftwf_make_planner_thread_safe"
          else
            echo "::error::fftw3f does not provide fftwf_make_planner_thread_safe,"
            echo "::error::so this build would fail to LINK hours from now. Build"
            echo "::error::FFTW from source with --enable-float --enable-threads"
            echo "::error::--with-combined-threads (see the windows-msys2 job)."
            tail -5 /tmp/fftw_probe.err
            missing=1
          fi

          test "$missing" -eq 0

      - name: Ensure a version is available to waf
        run: |
          if ! git describe HEAD >/dev/null 2>&1; then
            echo "No tag reachable from HEAD; creating ${ARDOUR_FALLBACK_VERSION}"
            git config user.email "ci@users.noreply.github.com"
            git config user.name "Ardour CI"
            git tag -a "${ARDOUR_FALLBACK_VERSION}" -m "CI fallback version" --no-sign
          fi
          git describe HEAD

      - name: Configure
        run: |
          set -x
          FLAGS="--cxx17 --prefix=/usr/local"
          if [ "${{ inputs.debug_build }}" != "true" ]; then
            FLAGS="$FLAGS --optimize"
          fi
          ./waf configure $FLAGS

      - name: Build
        run: ./waf -j"$(nproc)"

      - name: Install into a staging root
        run: ./waf install --destdir="$PWD/install-root"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-linux-x86_64
          path: install-root/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  macos:
    name: macOS (arm64)
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Homebrew)
        run: |
          set -eux
          # Ardour needs the *2.4 / *1.0 / *1.4 API lines of the C++ bindings,
          # which Homebrew only ships as versioned (keg-only) formulae now.
          # If this step fails, check `brew search` for the current names.
          brew install \
            pkg-config glib glibmm@2.66 libsigc++@2 cairomm@1.14 pangomm@2.46 \
            libsndfile libsamplerate fftw taglib \
            serd sord sratom lilv lv2 \
            rubberband aubio libarchive liblo libusb libxml2 flac libogg \
            boost curl jack

      - name: Point the compiler, linker and pkg-config at Homebrew
        run: |
          set -eux
          # First CI run failed here-by-omission with
          #   Checking for boost library >= 1.68 : no
          # wscript probes boost with a raw compile (`#include
          # <boost/version.hpp>`), NOT with pkg-config, so PKG_CONFIG_PATH alone
          # can never satisfy it.  Homebrew does not link keg-only formulae into
          # the prefix, and the Homebrew include dir is not on clang's default
          # search path, so CPPFLAGS is the lever that reaches that probe.
          # waf does fold CPPFLAGS and LDFLAGS from the environment into
          # conf.env - verified locally against waf 2.0.26, where the value
          # shows up verbatim in the recorded compile command.
          #
          # Rather than hardcode which formulae are keg-only (glibmm@2.66,
          # libsigc++@2, cairomm@1.14, pangomm@2.46, libxml2 and boost all have
          # been), ask brew for every prefix and export all three mechanisms.
          FORMULAE="pkg-config glib glibmm@2.66 libsigc++@2 cairomm@1.14 pangomm@2.46 \
                    libsndfile libsamplerate fftw taglib serd sord sratom lilv lv2 \
                    rubberband aubio libarchive liblo libusb libxml2 flac libogg \
                    boost curl jack"

          pcp=""; cpp=""; ld=""
          for f in $FORMULAE; do
            PFX="$(brew --prefix "$f" 2>/dev/null || true)"
            [ -n "$PFX" ] || continue
            if [ -d "$PFX/include" ]; then cpp="$cpp -I$PFX/include"; fi
            if [ -d "$PFX/lib" ]; then ld="$ld -L$PFX/lib"; fi
            if [ -d "$PFX/lib/pkgconfig" ]; then pcp="$pcp:$PFX/lib/pkgconfig"; fi
          done

          {
            echo "PKG_CONFIG_PATH=${pcp#:}"
            echo "CPPFLAGS=$cpp"
            echo "LDFLAGS=$ld"
          } >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=${pcp#:}"
          echo "CPPFLAGS=$cpp"

      - name: Preflight - mandatory dependencies and the FFTW threads symbol
        run: |
          # Fail in seconds with the whole list rather than hours into a build
          # with one item at a time.
          set -u
          missing=0

          # Everything configure will demand, in the order it demands it.
          # (alsa and jack are absent on purpose: this job configures
          # --with-backends=coreaudio,dummy.)
          for p in glib-2.0 gthread-2.0 glibmm-2.4 sndfile giomm-2.4 libcurl \
                   libarchive liblo taglib vamp-sdk vamp-hostsdk rubberband \
                   gio-2.0 gobject-2.0 gmodule-2.0 gio-unix-2.0 sigc++-2.0 \
                   cairo cairomm-1.0 pango pangocairo pangomm-1.4 fontconfig \
                   libpng libxml-2.0 flac ogg lilv-0 serd-0 sord-0 sratom-0 \
                   lv2 samplerate fftw3f; do
            ver="$(pkg-config --modversion "$p" 2>/dev/null)" \
              || { echo "::error::MISSING pkg-config package: $p"; missing=1; continue; }
            echo "ok  $p $ver"
          done

          # boost: raw header probe, exactly as wscript does it (no pkg-config)
          cat > /tmp/boost_probe.cc <<'EOF'
          #include <boost/version.hpp>
          #if !defined(BOOST_VERSION) || BOOST_VERSION < 106800
          #error boost >= 1.68 is not available
          #endif
          int main(void) { return 0; }
          EOF
          c++ -o /tmp/boost_probe /tmp/boost_probe.cc \
            || { echo "::error::boost >= 1.68 is not visible to the compiler"; missing=1; }

          # FFTW: Ardour calls fftwf_make_planner_thread_safe(). That symbol
          # exists only when FFTW is built with threads AND
          # --with-combined-threads, which packaged builds routinely omit - it
          # is exactly why the windows-msys2 job builds FFTW from source.
          # Probe by LINKING rather than by inspecting symbols: linking is the
          # thing that actually has to succeed, and it is immune to a stripped
          # binary giving a false negative.
          cat > /tmp/fftw_probe.cc <<'EOF'
          #include <fftw3.h>
          int main(void) { fftwf_make_planner_thread_safe(); return 0; }
          EOF
          if c++ -o /tmp/fftw_probe /tmp/fftw_probe.cc \
               $(pkg-config --cflags --libs fftw3f) 2> /tmp/fftw_probe.err; then
            echo "ok  fftw3f provides fftwf_make_planner_thread_safe"
          else
            echo "::error::fftw3f does not provide fftwf_make_planner_thread_safe,"
            echo "::error::so this build would fail to LINK hours from now. Build"
            echo "::error::FFTW from source with --enable-float --enable-threads"
            echo "::error::--with-combined-threads (see the windows-msys2 job)."
            tail -5 /tmp/fftw_probe.err
            missing=1
          fi

          test "$missing" -eq 0

      - name: Ensure a version is available to waf
        run: |
          if ! git describe HEAD >/dev/null 2>&1; then
            echo "No tag reachable from HEAD; creating ${ARDOUR_FALLBACK_VERSION}"
            git config user.email "ci@users.noreply.github.com"
            git config user.name "Ardour CI"
            git tag -a "${ARDOUR_FALLBACK_VERSION}" -m "CI fallback version" --no-sign
          fi
          git describe HEAD

      - name: Configure
        run: |
          set -x
          FLAGS="--cxx17 --with-backends=coreaudio,dummy --prefix=/usr/local"
          if [ "${{ inputs.debug_build }}" != "true" ]; then
            FLAGS="$FLAGS --optimize"
          fi
          ./waf configure $FLAGS

      - name: Build
        run: ./waf -j"$(sysctl -n hw.ncpu)"

      - name: Install into a staging root
        run: ./waf install --destdir="$PWD/install-root"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-macos-arm64
          path: install-root/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  windows-msys2:
    name: Windows (MSYS2 / MinGW-w64)
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # mingw-w64-x86_64-portaudio is listed explicitly even though jack2
          # pulls it in: on Windows libs/backends/jack/wscript probes
          # portaudio-2.0 with mandatory=True (it uses PortAudio to enumerate
          # device names). Relying on a transitive dependency for a mandatory
          # probe is how it silently disappears later.
          install: >-
            git unzip make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libusb

      - name: Build single-precision FFTW
        run: |
          set -eux
          # REQUIRED, and the single most surprising dependency of the whole
          # build: Ardour calls fftwf_make_planner_thread_safe(), which the
          # MSYS2 fftw package does not export because it is built without
          # --with-combined-threads. Without this, linking fails with an
          # undefined reference. Build a float+threads FFTW into /mingw64.
          curl -LO https://fftw.org/fftw-3.3.10.tar.gz
          tar xf fftw-3.3.10.tar.gz
          cd fftw-3.3.10
          ./configure \
            --build=x86_64-pc-msys --host=x86_64-w64-mingw32 \
            --prefix=/mingw64 \
            --enable-shared --disable-static \
            --enable-float --enable-threads --with-combined-threads \
            --with-our-malloc \
            --enable-sse --enable-sse2 --enable-avx --enable-avx2 \
            --disable-dependency-tracking
          make -j"$(nproc)"
          make install
          # Prove the symbol the link step needs is really there, so a broken
          # FFTW fails here with a clear message instead of as a confusing
          # undefined-reference error 500 files later.
          # NB: use objdump -p (PE export table). `nm -D` reports "no symbols"
          # for PE binaries, so it cannot be used for this check.
          if ! objdump -p /mingw64/bin/libfftw3f-3.dll \
                 | grep -q fftwf_make_planner_thread_safe; then
            echo "::error::libfftw3f-3.dll does not export fftwf_make_planner_thread_safe"
            exit 1
          fi
          echo "FFTW OK: fftwf_make_planner_thread_safe is exported"

      - name: Ensure a version is available to waf
        run: |
          if ! git describe HEAD >/dev/null 2>&1; then
            echo "No tag reachable from HEAD; creating ${ARDOUR_FALLBACK_VERSION}"
            git config user.email "ci@users.noreply.github.com"
            git config user.name "Ardour CI"
            git tag -a "${ARDOUR_FALLBACK_VERSION}" -m "CI fallback version" --no-sign
          fi
          git describe HEAD

      - name: Configure
        run: |
          set -x
          FLAGS="--check-c-compiler=gcc --check-cxx-compiler=g++"
          FLAGS="$FLAGS --dist-target=mingw"
          FLAGS="$FLAGS --prefix=$(cygpath -u "$GITHUB_WORKSPACE")/ardour-install"
          FLAGS="$FLAGS --configdir=share --no-execstack --no-dr-mingw --cxx17"
          FLAGS="$FLAGS --with-backends=jack,dummy"
          if [ "${{ inputs.debug_build }}" != "true" ]; then
            FLAGS="$FLAGS --optimize"
          fi
          # --dist-target=mingw is mandatory: it skips the dlopen/dlfcn.h probe,
          # and mingw-w64 has no dlfcn.h. Without it configure always fails with
          # "Checking for function 'dlopen' in dlfcn.h : no".
          python3 waf configure $FLAGS

      - name: Build
        run: python3 waf -j"$(nproc)"

      - name: Install
        run: python3 waf install

      - name: Smoke test the binary
        run: |
          set -x
          # NB: do not glob "ardour-*.exe" - that also matches
          # ardour-vst-scanner.exe / ardour-vst3-scanner.exe.
          EXE="$(ls ardour-install/lib/ardour9/ardour-[0-9]*.exe | head -1)"
          test -n "$EXE"
          ARDOUR_DATA_PATH="$PWD/ardour-install/share/ardour9" "$EXE" --version

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          # Relative to github.workspace: avoids mixing \ and / in a Windows path.
          name: ardour-windows-x86_64
          path: ardour-install
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Structural: the engine and the headless frontend must build with no toolkit
  # at all.  This is the precondition for the wasm/mobile targets, and it is the
  # job that fails when a toolkit dependency creeps back into libardour/libpbd
  # or into a toolkit-free control surface.
  headless-tkless:
    name: Headless, no toolkit (structural)
    if: github.event_name != 'workflow_dispatch' || inputs.headless_tkless
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update -qq

          # Deliberately the same set as the linux job above: the variable under
          # test is --no-tk-stack, not the availability of system libraries.
          # (The GTK stack that must disappear here is the *in-tree* one,
          # libs/tk/*, so having libpango/libpangomm installed changes nothing.)
          # The set is shared through $ARDOUR_APT_DEPS precisely so that it
          # cannot drift away from the linux job.
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $ARDOUR_APT_DEPS

      - name: Install optional dependencies (best effort)
        run: |
          set -ux
          for p in $ARDOUR_APT_DEPS_OPTIONAL; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::$p is not available - continuing without it"
          done

      - name: Ensure a version is available to waf
        run: |
          if ! git describe HEAD >/dev/null 2>&1; then
            echo "No tag reachable from HEAD; creating ${ARDOUR_FALLBACK_VERSION}"
            git config user.email "ci@users.noreply.github.com"
            git config user.name "Ardour CI"
            git tag -a "${ARDOUR_FALLBACK_VERSION}" -m "CI fallback version" --no-sign
          fi
          git describe HEAD

      - name: Configure without the bundled toolkit
        run: |
          set -euxo pipefail
          FLAGS="--cxx17 --prefix=/usr/local --configdir=share"
          FLAGS="$FLAGS --no-tk-stack --with-frontends=headless"
          FLAGS="$FLAGS --with-backends=jack,dummy --no-execstack --no-dr-mingw"
          [ "${{ inputs.debug_build }}" = "true" ] || FLAGS="$FLAGS --optimize"
          ./waf configure $FLAGS 2>&1 | tee configure.log

          # The toolkit must be *excluded* from the configuration, not merely
          # unused - and the toolkit-free control-surface protocol must survive.
          grep -q 'Bundled GTK toolkit *: no' configure.log
          grep -q 'Frontends *: headless' configure.log
          if grep -q "Checking for 'libwebsockets'.*: yes" configure.log; then
            echo "libwebsockets found: the websockets control protocol is in this build"
          else
            echo "::warning::libwebsockets not found - the websockets surface was skipped"
          fi

      - name: Build
        run: ./waf -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify the toolkit is really absent, and the binary runs
        run: |
          set -eux

          # 1. nothing from the bundled toolkit may have been produced at all
          BAD="$(find build \( \
                   -name 'libytk*' -o -name 'libydk*' -o -name 'libztk*' \
                -o -name 'libclearlooks*' -o -name 'libgtkmm2ext*' \
                -o -name 'libcanvas*' -o -name 'libwidgets*' \
                -o -name 'libwaveview*' \) -print -quit)"
          if [ -n "$BAD" ]; then
            echo "::error::--no-tk-stack still produced toolkit artefacts: $BAD"
            exit 1
          fi

          # 2. the engine/frontend must not link a toolkit
          BIN="$(ls build/headless/hardour-* | head -1)"
          test -n "$BIN"
          if ldd "$BIN" | grep -Eq 'libgtk-x11|libgtkmm|libytk|libydk|libztk'; then
            echo "::error::$BIN links a GTK toolkit"
            ldd "$BIN" | grep -E 'gtk|ytk|ydk|ztk'
            exit 1
          fi

          # 3. it runs. --version returns before any audio backend is created,
          #    so neither a display nor an audio device is needed.
          export LD_LIBRARY_PATH="$(find build -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          "$BIN" --version

  # ---------------------------------------------------------------------------
  # Structural: --dist-target=wasm32 target selection.  Configure only: what is
  # being pinned here is that the *target* decides (flags, dlopen probe, backend
  # choice), not the build host.
  wasm32:
    name: wasm32 target selection (structural, configure only)
    if: github.event_name != 'workflow_dispatch' || inputs.wasm32
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      WASM_FLAGS: >-
        --cxx17 --configdir=share --dist-target=wasm32
        --with-frontends=none --no-tk-stack --with-backends=dummy
        --no-execstack --no-dr-mingw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          set -eux
          sudo apt-get update -qq

          # Needed so the *host compiler* configure below can run to the end:
          # the flag summary is printed after all mandatory dependency probes.
          # (The shared list also brings jack/alsa/x11, which this job does not
          # use - it configures --with-backends=dummy.  Harmless, and it keeps
          # one single place where the mandatory set is maintained.)
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $ARDOUR_APT_DEPS

      - name: Install optional dependencies (best effort)
        run: |
          set -ux
          for p in $ARDOUR_APT_DEPS_OPTIONAL; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::$p is not available - continuing without it"
          done

      - name: Ensure a version is available to waf
        run: |
          if ! git describe HEAD >/dev/null 2>&1; then
            echo "No tag reachable from HEAD; creating ${ARDOUR_FALLBACK_VERSION}"
            git config user.email "ci@users.noreply.github.com"
            git config user.name "Ardour CI"
            git tag -a "${ARDOUR_FALLBACK_VERSION}" -m "CI fallback version" --no-sign
          fi
          git describe HEAD

      - name: Configure for wasm32 with the host compiler (flag regression check)
        run: |
          set -euxo pipefail

          # A scratch --out: this job configures twice and the two runs must not
          # overwrite each other's configuration.
          ./waf configure --out=build-wasm-host \
            --check-c-compiler=gcc --check-cxx-compiler=g++ $WASM_FLAGS 2>&1 | tee wasm-host.log

          # The target - not the host - must decide.
          grep -q 'Building for *: wasm / wasm32' wasm-host.log
          grep -q 'n/a for wasm' wasm-host.log
          grep -Eq 'LXVST support *: False' wasm-host.log
          grep -Eq 'VST3 support *: False' wasm-host.log

          # No x86/assembler flag may leak into a wasm build.  This is exactly
          # the regression that target-driven flag selection exists to prevent:
          # -DARCH_X86, -msse*, -mfpmath=sse, -masm= and -DLXVST_32BIT all used to
          # follow the *host* CPU.  Only the flag lines are inspected, so an
          # unrelated occurrence elsewhere in the log cannot fail the job.
          FLAGLINES="$(grep -E 'C([+][+])? compiler flags' wasm-host.log)"
          test -n "$FLAGLINES"
          if echo "$FLAGLINES" | grep -qE 'ARCH_X86|-msse|-mfpmath=sse|-masm=|LXVST_32BIT'; then
            echo "::error::host/x86-specific flags leaked into the wasm32 configuration:"
            echo "$FLAGLINES"
            exit 1
          fi
          echo "wasm32 flag check passed:"
          echo "$FLAGLINES"

      - name: Configure for wasm32 with emcc
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          set +u
          # shellcheck disable=SC1091
          source "$HOME/emsdk/emsdk_env.sh"
          set -u
          # NB: pin the SDK version once stage 1 has fixed the wasm dependency
          # baseline; "latest" is only acceptable while this is exploratory.

          # waf 2.0.26 predates Emscripten support (there is no
          # waflib/Tools/emcc.py), so emcc cannot be named via
          # --check-c-compiler.  What does work is waf's *clang* tool plus a
          # CC/CXX override: it calls find_program('clang', var='CC') and then
          # only requires the compiler to define __clang__, which emcc does.
          # Verified against emcc 6.0.11.
          export CC=emcc CXX=em++

          # This configure is expected to FAIL until the dependency stack is
          # cross-compiled, so the exit status is captured instead of propagated.
          set +e
          ./waf configure --out=build-wasm-emcc \
            --check-c-compiler=clang --check-cxx-compiler=clang++ $WASM_FLAGS 2>&1 | tee wasm-emcc.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # The toolchain must be accepted...
          for probe in "Checking for 'clang' (C compiler)" "Checking for 'clang++' (C++ compiler)"; do
            LINE="$(grep -F "$probe" wasm-emcc.log || true)"
            if [ -z "$LINE" ] || [ "${LINE#*not found}" != "$LINE" ]; then
              echo "::error::waf did not accept emcc: ${LINE:-no '$probe' line in the log}"
              exit 1
            fi
            echo "$LINE"
          done

          # ...and the target decisions must match the host-compiler run.
          grep -q 'Building for *: wasm / wasm32' wasm-emcc.log
          grep -q 'n/a for wasm' wasm-emcc.log

          # No host-platform probe may run for a wasm target: a ": no" on either
          # of these means a probe ran against the wrong platform.
          if grep -qE "in dlfcn.h *: no|Could not find gcc" wasm-emcc.log; then
            echo "::error::a host-platform probe ran (and failed) for the wasm32 target"
            grep -E "dlfcn|Could not find gcc" wasm-emcc.log
            exit 1
          fi

          # Cross-compiling glib/glibmm/boost/... to wasm is stage-1 work, so
          # configure is *expected* to stop at the first dependency that has no
          # wasm build yet.  Require that it stopped there - after the target
          # decisions above were made - and report where, so stage 1 starts from
          # a known place rather than from a guess.
          if [ "$STATUS" -ne 0 ]; then
            if grep -qE 'Checking for boost|boost library|glib-2\.0' wasm-emcc.log; then
              echo "configure stopped at a dependency that has no wasm build yet:"
              grep -E 'Checking for boost|boost library|glib-2\.0' wasm-emcc.log | tail -3
            else
              echo "::error::configure failed before it reached dependency detection"
              exit 1
            fi
          else
            echo "configure completed under emcc: the wasm dependency stack resolves now"
            echo "-> tighten this job: the target decisions are no longer the only thing verified"
          fi
